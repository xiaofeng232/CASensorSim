# SPDX-License-Identifier: Apache-2.0
# CASensorSim on FK407M2-ZGT6: native USB bulk transport for the Fibre
# protocol (Type-C connector; the board has no USB-UART bridge).
#
# The Fibre transport backend lives in the platform lib module
# (lib/services/fibre-transport service), which requires the USB device
# stack. These
# settings mirror the platform board fragment used by the matrix-cards app
# -- cas-sim does not inherit that fragment because it defines its own
# app-level board overlay.

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_FIBRE_TRANSPORT=y
CONFIG_FIBRE_TRANSPORT_USB=y

# USB identity on the host.
CONFIG_FIBRE_TRANSPORT_USB_MANUFACTURER="Xiaofeng"
CONFIG_FIBRE_TRANSPORT_USB_PRODUCT="CASensorSim"

# USB stack stability under the 10 us TIM8 signal-tick load.
CONFIG_UDC_STM32_STACK_SIZE=1024
CONFIG_USBD_THREAD_STACK_SIZE=2048
