# SPDX-License-Identifier: Apache-2.0
# CASensorSim on FK407M2-ZGT6: USB CDC-ACM transport for the Fibre protocol
# (Type-C connector; the board has no USB-UART bridge).
#
# These settings mirror the platform board fragment (boards/others/
# fk407m2_zgt6/fk407m2_zgt6.conf) used by the matrix-cards app -- cas-sim
# does not inherit it because it defines its own app-level board overlay.

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="CASensorSim"
CONFIG_UART_LINE_CTRL=y

# USB stack stability under the 10 us TIM8 signal-tick load.
CONFIG_UDC_STM32_STACK_SIZE=1024
CONFIG_USBD_THREAD_STACK_SIZE=2048
