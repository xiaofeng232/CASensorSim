# CASensorSim -- CA sensor signal simulator firmware.
#
# The virtual CA engine is the cas/ library (bit-exact casim port, no
# Kconfig of its own). The 10 us signal tick runs on TIM8 via the
# Zephyr counter API (see boards/fk407m2_zgt6.overlay + main.c).
# Fault injection (cas_fault) is wired but all-off at power-up (FR-34).
CONFIG_COUNTER=y
CONFIG_LOG=y
# FP context sharing: the signal ISR runs double-precision core math.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
