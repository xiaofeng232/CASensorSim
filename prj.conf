# CASensorSim -- CA sensor signal simulator firmware (FK407M2-ZGT6).
#
# The Fibre protocol (telemetry/parameter interface) runs over the native
# USB bulk interface on the Type-C connector (the board has no USB-UART
# bridge; the transport backend comes from the platform fibre-transport
# module, see boards/fk407m2_zgt6.conf). USART1 is not used by this app
# (disabled in the app overlay). Console and shell stay disabled: the USB
# interface carries the protocol stream, and the boot banner is visible in
# the RTT debug build (`-DEXTRA_CONF_FILE=rtt.conf`, SEGGER RTT over SWD).

# The USB interface is Fibre's exclusive protocol stream: no console, no
# shell.
CONFIG_CONSOLE=n
CONFIG_SHELL=n

CONFIG_SERIAL=y
CONFIG_GPIO=y

# 10 us signal tick on TIM8 (Zephyr counter API); the ISR runs
# double-precision core math, so FP context sharing is required.
CONFIG_COUNTER=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Fibre (C++ library, west module modules/lib/fibre).
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_REQUIRES_FULL_LIBCPP=y
# Fibre uses typeid/dynamic_cast (its module compiles with -frtti).
CONFIG_CPP_RTTI=y
CONFIG_FIBRE=y
# Note: the client role must stay enabled: with FIBRE_ENABLE_CLIENT=0 the
# fibre-cpp headers (legacy_protocol.hpp) do not compile because the Socket
# types they reference are only pulled in via the client headers.
CONFIG_FIBRE_ENABLE_SERVER=1
CONFIG_FIBRE_ENABLE_CLIENT=1
CONFIG_FIBRE_ZEPHYR_EVENT_LOOP=y

# Boot banner (platform module: lib/util/banner) with the CASIM logo. The
# default build has no console backend (the USB interface is Fibre's
# protocol stream), so the page is silently discarded there; it becomes
# visible in the RTT debug build (rtt.conf routes printk into the log
# backend).
CONFIG_BANNER=y
CONFIG_BANNER_LOGO=y
CONFIG_BANNER_PRODUCT="CASensorSim"
CONFIG_BANNER_NAME="CASIM"
