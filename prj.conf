# CASensorSim -- CA sensor signal simulator firmware (FK407M2-ZGT6).
#
# USART1 is dedicated to the Fibre protocol (telemetry/parameter
# interface): the console, shell and UART log backend are disabled so no
# other traffic touches the protocol stream. Use
# `-DEXTRA_CONF_FILE=rtt.conf` for logs over SEGGER RTT (SWD) instead.

# Fibre owns the UART: no console output, no shell.
CONFIG_CONSOLE=n
CONFIG_SHELL=n

CONFIG_SERIAL=y
CONFIG_GPIO=y

# 10 us signal tick on TIM8 (Zephyr counter API); the ISR runs
# double-precision core math, so FP context sharing is required.
CONFIG_COUNTER=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Fibre (C++ library, west module modules/lib/fibre).
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_REQUIRES_FULL_LIBCPP=y
# Fibre uses typeid/dynamic_cast (its module compiles with -frtti).
CONFIG_CPP_RTTI=y
CONFIG_FIBRE=y
# Note: the client role must stay enabled: with FIBRE_ENABLE_CLIENT=0 the
# fibre-cpp headers (legacy_protocol.hpp) do not compile because the Socket
# types they reference are only pulled in via the client headers.
CONFIG_FIBRE_ENABLE_SERVER=1
CONFIG_FIBRE_ENABLE_CLIENT=1
CONFIG_FIBRE_ZEPHYR_EVENT_LOOP=y
