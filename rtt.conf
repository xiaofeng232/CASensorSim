# Optional debug variant: SEGGER RTT logging over SWD (channel 0) while the
# USB CDC-ACM port stays exclusive to the Fibre protocol.
#
#   west build -p always -b fk407m2_zgt6 apps/cas-sim -d apps/cas-sim/build-rtt \
#       -- -DEXTRA_CONF_FILE=rtt.conf
#
# Then expose the RTT channel with OpenOCD:
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg \
#       -c "adapter speed 100" -c init -c "reset run" \
#       -c 'rtt setup <addr of _SEGGER_RTT> 0x100 "SEGGER RTT"' \
#       -c "rtt start" -c "rtt server start 9090 0"
#
#   nc 127.0.0.1 9090        # logs (cas-sim + fibre protocol)

CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
# Route printk (the boot banner page) into the log backend so it reaches
# RTT as well.
CONFIG_LOG_PRINTK=y
